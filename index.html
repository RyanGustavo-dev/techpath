<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TechPath</title>
  <meta name="description" content="Plataforma pessoal de estudos e recolocação profissional em TI: trilhas, quizzes, laboratórios, revisão espaçada e preparação para entrevistas." />
  <meta name="theme-color" content="#161718" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1220'/%3E%3Cpath d='M8 22 14 14l4 4 6-9' fill='none' stroke='%232dd4bf' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='24' cy='9' r='2.5' fill='%23fbbf24'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <div class="app">
    <aside class="sidebar" aria-label="Navegação principal">
      <a class="brand" href="#/inicio" aria-label="TechPath — Início">
        <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" class="brand-bg"/><path d="M8 22 14 14l4 4 6-9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="9" r="2.5" class="brand-dot"/></svg>
        <span>TechPath</span>
      </a>
      <nav><ul id="nav-list" class="nav-list"></ul></nav>
      <div id="user-stats" class="user-stats" aria-live="polite"></div>
    </aside>
    <main id="main" class="main" tabindex="-1">
      <div class="card loading"><p>Carregando…</p></div>
    </main>
  </div>

  <div id="storage-banner" class="storage-banner" role="alert" hidden><span></span></div>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <dialog id="dialog" class="dialog" aria-modal="true"></dialog>

  <noscript><div class="card fatal">O TechPath precisa de JavaScript habilitado.</div></noscript>
  <script>
    // Módulos ES não carregam via file:// na maioria dos navegadores.
    if (location.protocol === 'file:') {
      document.getElementById('main').innerHTML =
        '<div class="card fatal"><h1>Abra por um servidor local</h1>' +
        '<p>Por segurança, os navegadores bloqueiam módulos JavaScript abertos direto do disco (file://).</p>' +
        '<p>Na pasta do projeto, execute:</p><pre class="code"><code>python -m http.server 8080</code></pre>' +
        '<p>e acesse <strong>http://localhost:8080</strong>. Veja o README para outras opções.</p></div>';
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
